name: Package and publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a configured CurseForge project
        run: test "$(sed -n 's/^## X-Curse-Project-ID: //p' AggeStealthBar/AggeStealthBar.toc)" -gt 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa
      - run: python tests/check.py
      - name: Publish to CurseForge
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
